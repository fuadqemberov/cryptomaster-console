cryptomaster.top-coin-count=500
cryptomaster.intervals=1h,4h,1d
cryptomaster.analysis-interval-seconds=300

binance.ws.base-url=wss://stream.binance.com:9443/stream
binance.rest.base-url=https://api.binance.com
binance.ohlc-intervals=1h,4h,1d
binance.ohlc-limit=300

logging.level.com.cryptomaster=INFO

# ---- Futures / turev verileri ----
binance.futures.rest.base-url=https://fapi.binance.com
binance.futures.ws.base-url=wss://fstream.binance.com/ws
cryptomaster.derivatives-enabled=true
cryptomaster.derivatives-top-count=80

# ---- Scalp (5-10 dk hizli al-sat) ----
cryptomaster.scalp-enabled=true
cryptomaster.scalp-intervals=1m,5m,15m
cryptomaster.scalp-top-count=40
cryptomaster.scalp-interval-seconds=45
cryptomaster.scalp-ohlc-limit=240
cryptomaster.scalp-min-confidence=72